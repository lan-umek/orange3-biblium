# Read the Docs build configuration.
# The documentation sources live in docs/ (Sphinx + MyST, one page per widget);
# the same sources are rendered into the in-application help shipped with the
# add-on, so this build also validates that help content.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
