name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          # Keep the matrix to one job per OS on the older interpreter.
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.10"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "PyQt5>=5.15" PyQtWebEngine pytest

      - name: Run tests
        run: pytest tests -v

  # The statistical safeguards depend only on NumPy, so they are also checked
  # without Orange or Qt installed: this guards against the module acquiring an
  # accidental dependency on the widget stack.
  standalone-statistics:
    name: Statistics module without Orange
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy pytest statsmodels scipy
      - run: pytest tests/test_statsafe.py -v

  # The documentation sources are also rendered into the in-application help
  # shipped with the add-on, so a broken build would silently degrade the
  # per-widget help as well.
  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r docs/requirements.txt
      - run: sphinx-build -b html docs docs/_build/html
